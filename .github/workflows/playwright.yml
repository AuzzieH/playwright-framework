name: Playwright Tests

permissions:
  contents: read
  checks: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Which tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ui
          - api
          - smoke

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    needs: lint
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: inputs.test_suite != 'api'
        run: npx playwright install --with-deps

      - name: Determine test command
        id: test-cmd
        run: |
          SUITE="${{ inputs.test_suite || 'all' }}"
          if [ "$SUITE" = "ui" ]; then
            echo "cmd=npx playwright test --project=ui-chromium" >> "$GITHUB_OUTPUT"
          elif [ "$SUITE" = "api" ]; then
            echo "cmd=npx playwright test --project=api" >> "$GITHUB_OUTPUT"
          elif [ "$SUITE" = "smoke" ]; then
            echo "cmd=npx playwright test --grep @smoke" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=npx playwright test" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Playwright tests
        run: ${{ steps.test-cmd.outputs.cmd }}
        env:
          CI: true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      - name: Display test results in summary
        uses: dorny/test-reporter@v1
        if: ${{ !cancelled() }}
        with:
          name: Playwright Results
          path: test-results/junit-results.xml
          reporter: java-junit
